name: Render Ping

on:
  schedule:
    - cron: '*/7 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        env:
          PING_URL: ${{ secrets.RENDER_PING_URL || 'https://novel-trace.onrender.com/health' }}
        run: |
          curl --fail --silent --show-error --max-time 30 "$PING_URL" > /dev/null
