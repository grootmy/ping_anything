name: Render Ping

on:
  # main에 커밋하면 바로 실행 (설정/동작 확인용)
  push:
    branches: [main]

  # 3분 주기 실행
  schedule:
    - cron: "1-59/5 * * * *"  # 01,06,11,... 로 정각 회피

  # Actions 탭에서 수동 실행 버튼
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4  # curl 최대시간(120s) + retry 여유

    steps:
      - name: Ping Render service
        shell: bash
        run: |
          set -euo pipefail

          # Secret이 있으면 사용, 없으면 기본 URL 사용
          PING_URL="${{ secrets.RENDER_PING_URL }}"
          if [ -z "${PING_URL}" ]; then
            PING_URL="https://novel-trace.onrender.com/health"
          fi

          echo "Event: ${{ github.event_name }}"
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Ping URL: ${PING_URL}"

          # Ping (안정적으로: 120초 + retry)
          curl --fail --silent --show-error \
            --max-time 120 \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -o /dev/null \
            -w "HTTP %{http_code}\n" \
            "${PING_URL}"

          echo "OK"
